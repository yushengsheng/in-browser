name: Windows release acceptance

on:
  push:
    branches: ['release/validation-*']
  workflow_dispatch:

permissions:
  contents: write # Read the unpublished candidate release and its assets.

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the synthetic candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'ib'
          New-Item -ItemType Directory -Path $package | Out-Null
          gh release download validation-v0.1.0 --repo $env:GITHUB_REPOSITORY --pattern portable-test-v0.1.0.7z --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $archive = Join-Path $env:RUNNER_TEMP 'portable-test-v0.1.0.7z'
          $expected = (Get-Content -LiteralPath '.github/portable-fixture.sha256' -Raw).Trim()
          if ($expected -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Candidate digest mismatch' }
          & (Join-Path $env:ProgramFiles '7-Zip/7z.exe') x $archive "-o$package" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'Candidate extraction failed' }
          "IB_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run the complete source checks
        shell: pwsh
        run: |
          & "$env:IB_PACKAGE/runtime/python/python.exe" -B tools/check_project.py --report "$env:RUNNER_TEMP/source-check.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source checks failed' }
      - name: Start a fresh manager
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path analysis/reports -Force | Out-Null
          & "$env:IB_PACKAGE/runtime/python/python.exe" -B "$env:IB_PACKAGE/tools/verify_clean_start.py" --execute | Tee-Object -FilePath analysis/reports/clean-start.json
          if ($LASTEXITCODE -ne 0) { throw 'Fresh manager acceptance failed' }
      - name: Open the locally created profile on this device
        if: ${{ !cancelled() && env.IB_PACKAGE != '' }}
        shell: pwsh
        run: |
          & "$env:IB_PACKAGE/runtime/python/python.exe" -B "$env:IB_PACKAGE/tools/verify_portable_fixture.py" --execute
          if ($LASTEXITCODE -ne 0) { throw 'Cross-device acceptance failed' }
      - name: Keep only anonymous acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-acceptance-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/source-check.json
            analysis/reports/clean-start.json
            ${{ env.IB_PACKAGE }}/analysis/reports/portable-device.json
          if-no-files-found: warn
          retention-days: 14
